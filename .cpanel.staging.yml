---
# cPanel Deployment Configuration for IPnz.live
# STAGING/DEV DEPLOYMENT - Development site (auth-dev.ipnz.live → /ipnz-live/www)
# Rename this file to .cpanel.yml for the staging repository

deployment:
  tasks:
    # Set deployment path for STAGING
    - export DEPLOYPATH=/home2/ipnz/ipnz-live/www
    - echo "========================================="
    - echo "STAGING DEPLOYMENT to auth-dev.ipnz.live"
    - echo "========================================="
    
    # Deploy www directory contents to staging path
    - /bin/cp -R www/* $DEPLOYPATH/
    
    # Create avatars directory if it doesn't exist
    - mkdir -p $DEPLOYPATH/images/avatars
    - /bin/chmod 755 $DEPLOYPATH/images/avatars
    
    # Set proper permissions for PHP files (readable, not executable)
    - find $DEPLOYPATH -type f -name "*.php" -exec /bin/chmod 644 {} \;
    - find $DEPLOYPATH -type d -exec /bin/chmod 755 {} \;
    
    # Preserve existing database config, don't overwrite
    - |
      if [ ! -f "$DEPLOYPATH/datacenter/database.config.php" ]; then
        echo "WARNING: database.config.php not found!"
        echo "Please create from database.config.example.php"
        echo "STAGING should use a separate test database!"
      else
        echo "Preserving existing STAGING database.config.php"
        /bin/chmod 600 $DEPLOYPATH/datacenter/database.config.php
      fi
    
    # Ensure example file is readable
    - /bin/chmod 644 $DEPLOYPATH/datacenter/database.config.example.php
    
    # Clear PHP opcode cache by touching main files
    - touch $DEPLOYPATH/index.php
    - touch $DEPLOYPATH/join.php
    - touch $DEPLOYPATH/auth.php
    
    # Log deployment completion
    - echo "========================================="
    - echo "STAGING deployment completed!"
    - echo "Site: https://auth-dev.ipnz.live"
    - echo "Time: $(date)"
    - echo "========================================="
    - echo "NOTE: Staging uses TEST database - verify config!"
