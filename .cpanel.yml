---
deployment:
  id: 'ipnz-avatars-genies'
  name: 'IPnz Avatars - Genies Integration'
  branch: rpm-genie
  repository: 'https://github.com/JoMangee/ipnz.live.git'
  targetPath: '/home2/ipnz/avatars.ipnz.live/www'
  tasks:
    before_deploy:
      - mkdir -p /home2/ipnz/avatars.ipnz.live/www
    after_deploy:
      - chmod -R 755 /home2/ipnz/avatars.ipnz.live/www
      - find /home2/ipnz/avatars.ipnz.live/www -type f -name '*.php' -exec chmod 644 {} \;
      - find /home2/ipnz/avatars.ipnz.live/www -type d -exec chmod 755 {} \;
  hooks:
    post_deploy: |
      #!/bin/bash
      # Post deployment verification
      if [ -f /home2/ipnz/avatars.ipnz.live/www/www/join.php ]; then
        echo "Deployment successful: join.php exists"
      else
        echo "Deployment warning: join.php not found"
      fi
      if [ -f /home2/ipnz/avatars.ipnz.live/www/www/avatarcreate.php ]; then
        echo "Deployment successful: avatarcreate.php exists"
      else
        echo "Deployment warning: avatarcreate.php not found"
      fi
      if [ -f /home2/ipnz/avatars.ipnz.live/www/www/avatarcreate_test.php ]; then
        echo "Deployment successful: avatarcreate_test.php exists"
      else
        echo "Deployment warning: avatarcreate_test.php not found"
      fi
  environment_variables:
    - name: 'GENIES_PUBLIC_API_KEY'
      prompt: true
      required: true
  rollback:
    enabled: true
    keep_backups: 3
